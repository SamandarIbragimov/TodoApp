<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management</title>
    <!-- Tailwind CSS (Dizayn chiroyli chiqishi uchun) -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <div class="max-w-4xl mx-auto py-10 px-4">
        <!-- Sarlavha qismi -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-800 tracking-tight">
                📝 Task Management
            </h1>
            <p class="text-gray-500 mt-2">Vazifalaringizni tartiblang va samaradorlikni oshiring</p>
        </header>

        <!-- Yangi vazifa qo'shish formasi -->
        <section class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-xl font-bold text-gray-700 mb-4">Yangi vazifa qo'shish</h2>
            <form class="flex flex-col sm:flex-row gap-4">
                <input type="text" placeholder="Vazifa nomini kiriting..." 
                       class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700">
                <button type="submit" 
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg transition duration-200">
                    Qo'shish
                </button>
            </form>
        </section>

        <!-- Vazifalar ro'yxati -->
        <section class="bg-white p-6 rounded-xl shadow-md">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-700">Mening vazifalarim</h2>
                <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">Jami: 3 ta</span>
            </div>

            <!-- Vazifalar qatorlari -->
            <div class="space-y-4">
                
                <!-- 1-Vazifa (Bajarilmagan) -->
                <div class="flex items-center justify-between p-4 bg-gray-50 border border-gray-200 rounded-lg hover:shadow-sm transition">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                        <span class="text-gray-800 font-medium">Django loyihasini GitHub'ga yuklash</span>
                    </div>
                    <button class="text-red-500 hover:text-red-700 text-sm font-medium transition">O'chirish</button>
                </div>

                <!-- 2-Vazifa (Bajarilmagan) -->
                <div class="flex items-center justify-between p-4 bg-gray-50 border border-gray-200 rounded-lg hover:shadow-sm transition">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                        <span class="text-gray-800 font-medium">HTML interfeysni Django templates'ga ulash</span>
                    </div>
                    <button class="text-red-500 hover:text-red-700 text-sm font-medium transition">O'chirish</button>
                </div>

                <!-- 3-Vazifa (Bajarilgan holatda) -->
                <div class="flex items-center justify-between p-4 bg-green-50 border border-green-200 rounded-lg">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" checked class="w-5 h-5 text-green-600 rounded focus:ring-green-500">
                        <span class="text-gray-500 line-through font-medium">.gitignore faylini yaratish</span>
                    </div>
                    <button class="text-red-500 hover:text-red-700 text-sm font-medium transition">O'chirish</button>
                </div>

            </div>
        </section>
    </div>

    
</body>
</html>
