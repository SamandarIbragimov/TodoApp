services:
  - type: web
    name: todo-app
    runtime: python
    plan: free

    autoDeploy: true
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate

    startCommand: gunicorn todo_project.wsgi:application

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "*"

      - key: CSRF_TRUSTED_ORIGINS
        value: ""

      - key: DATABASE_URL
        value: ""
