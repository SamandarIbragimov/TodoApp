<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Management{% endblock %} — Task Management</title>
    <!-- Tailwind CSS (Dizayn chiroyli chiqishi uchun) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <div class="max-w-4xl mx-auto py-10 px-4">
        <!-- Sarlavha qismi -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-800 tracking-tight">
                <a href="/">📝 Task Management</a>
            </h1>
        </header>

        <!-- Xabarlar (messages) -->
        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                    <div class="px-4 py-3 rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-800{% else %}bg-green-100 text-green-800{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Har bir sahifaning asosiy qismi shu yerga tushadi -->
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
