{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management</title>
    <!-- Tailwind CSS (Dizayn chiroyli chiqishi uchun) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <div class="max-w-4xl mx-auto py-10 px-4">
        <!-- Foydalanuvchi paneli -->
        <div class="flex justify-end items-center gap-3 mb-4 text-sm text-gray-600">
            <span>👤 {{ request.user.username }}</span>
            <form method="post" action="{% url 'rest_framework:logout' %}">
                {% csrf_token %}
                <button type="submit" class="text-blue-600 hover:underline">Chiqish</button>
            </form>
        </div>

        <!-- Sarlavha qismi -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-800 tracking-tight">
                📝 Task Management
            </h1>
            <p class="text-gray-500 mt-2">Vazifalaringizni tartiblang va samaradorlikni oshiring</p>
        </header>

        <!-- Yangi vazifa qo'shish formasi -->
        <section class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-xl font-bold text-gray-700 mb-4">Yangi vazifa qo'shish</h2>
            <form id="task-form" class="flex flex-col sm:flex-row gap-4">
                <input id="task-title" type="text" required maxlength="200" placeholder="Vazifa nomini kiriting..."
                       class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700">
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg transition duration-200">
                    Qo'shish
                </button>
            </form>
            <p id="task-error" class="text-red-600 text-sm mt-3 hidden"></p>
        </section>

        <!-- Vazifalar ro'yxati -->
        <section class="bg-white p-6 rounded-xl shadow-md">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-700">Mening vazifalarim</h2>
                <span id="task-count" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">Jami: 0 ta</span>
            </div>

            <!-- Vazifalar qatorlari (JS orqali API'dan yuklanadi) -->
            <div id="task-list" class="space-y-4">
                <p class="text-gray-400 text-center">Yuklanmoqda...</p>
            </div>
        </section>
    </div>

    <script>
        window.API = {
            tasks: "{% url 'task-list' %}",
            stats: "{% url 'task-stats' %}",
            csrfToken: "{{ csrf_token }}",
        };
    </script>
    <script src="{% static 'js/tasks.js' %}"></script>
</body>
</html>
